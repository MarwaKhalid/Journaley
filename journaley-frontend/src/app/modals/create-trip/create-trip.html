<h2 class="modal-title text-center" mat-dialog-title>Create Trip</h2>
<mat-dialog-content class="mat-typography">
  <app-input-field
    label="Trip Name"
    id="trip-name"
    placeholder="Trip Name"
    [(value)]="tripName"
  ></app-input-field>
  <div class="mb-3"></div>
  <app-description-field label="People Traveled With" placeholder="Names"></app-description-field>
  <div class="mb-3"></div>
  <app-upload-image-field></app-upload-image-field>
  <div class="mb-3"></div>
  <app-upload-image-field></app-upload-image-field>
  <div class="mb-3"></div>
  <app-upload-image-field></app-upload-image-field>
</mat-dialog-content>
<div class="mt-3"></div>
<mat-dialog-actions>
  <app-text-button mat-dialog-close btn_type="cancel" placeholder="Cancel"></app-text-button>
  <app-text-button
    btn_type="submit"
    placeholder="Add Trip"
    (btnClick)="onSubmit()"
  ></app-text-button>
</mat-dialog-actions>
