<div class="d-flex justify-content-center mt-4">
  <div class="rounded-circle icon-btn d-flex justify-content-center align-items-center">
    <i class="bi bi-trash3"></i>
  </div>
</div>
<h2 class="modal-title text-center" mat-dialog-title>Delete Country?</h2>
<mat-dialog-content>
  <p class="sub-text">
    Are you sure you want to delete <strong>{{ countryName }}</strong
    >? This action cannot be undone.
  </p>
</mat-dialog-content>
<div class="mt-3"></div>
<mat-dialog-actions>
  <app-text-button mat-dialog-close btn_type="cancel" placeholder="Cancel"></app-text-button>
  <app-text-button btn_type="delete" placeholder="Delete" (btnClick)="onSubmit()"></app-text-button>
</mat-dialog-actions>
