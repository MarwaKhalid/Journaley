<h2 class="modal-title text-center" mat-dialog-title>Edit Entry</h2>
<mat-dialog-content class="mat-typography">
  <app-dropdown
    label="City"
    [hidePlaceholderOption]="true"
    [options]="cityOptions"
    [(value)]="selectedCityId"
  >
  </app-dropdown>
  <div class="mb-3"></div>
  <app-dropdown
    label="Category"
    [hidePlaceholderOption]="true"
    [options]="categoryOptions"
    [(value)]="selectedCategory"
  >
  </app-dropdown>
  <div class="mb-3"></div>
  <app-input-field
    label="Name"
    id="entry-name"
    placeholder="Entry Name"
    [(value)]="entryName"
  ></app-input-field>
  <div class="mb-3"></div>
  <app-rating-field
    id="entry-rating"
    [readonly]="false"
    [rating]="entryRating"
    (ratingChange)="entryRating = $event"
  ></app-rating-field>
  <div class="mb-3"></div>
  <app-input-field
    label="Location"
    id="entry-location"
    placeholder="Location"
    [(value)]="entryLocation"
  ></app-input-field>
  <div class="mb-3"></div>
  <app-description-field
    placeholder="Describe your experience"
    [(value)]="entryDescription"
  ></app-description-field>
  <div class="mb-3"></div>
</mat-dialog-content>
<div class="mt-3"></div>
<mat-dialog-actions>
  <app-text-button mat-dialog-close btn_type="cancel" placeholder="Cancel"></app-text-button>
  <app-text-button btn_type="submit" placeholder="Update" (btnClick)="onSubmit()"></app-text-button>
</mat-dialog-actions>
