<div class="d-flex justify-content-center align-items-center min-vh-100">
  <div class="register-card card p-2" style="width: 30rem">
    <div class="card-body">
      <p class="card-text title mb-0">Register</p>
      <p class="card-text sub-text">Create your Journaley account</p>

      <form (ngSubmit)="onSubmit()">
        <button type="submit" class="visually-hidden" tabindex="-1">Submit</button>
        @if (errorMessage) {
          <div class="alert alert-danger py-2 small" role="alert">{{ errorMessage }}</div>
        }
        <div class="mb-3">
          <app-input-field
            label="Name"
            placeholder="Name"
            id="register-name"
            [(value)]="name"
          ></app-input-field>
        </div>
        <div class="mb-3">
          <app-input-field
            label="Email"
            placeholder="Email"
            id="register-email"
            [(value)]="email"
          ></app-input-field>
        </div>
        <div class="mb-3">
          <app-input-field
            label="Password"
            placeholder="Password"
            id="register-pass"
            type="password"
            [(value)]="password"
          ></app-input-field>
        </div>
        <div class="mb-3">
          <app-input-field
            label="Confirm Password"
            placeholder="Password"
            id="register-confirm-pass"
            type="password"
            [(value)]="confirmPassword"
          ></app-input-field>
        </div>
        <div class="mt-2">
          <app-text-button
            btn_type="submit"
            placeholder="Register"
            [active]="!submitting"
          ></app-text-button>
        </div>
      </form>

      <p class="card-text sub-text text-center mt-2">
        Already have an account? <a routerLink="/login">Login</a>
      </p>
    </div>
  </div>
</div>
