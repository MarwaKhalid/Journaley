<nav class="navbar nav px-3">
  <a routerLink="/" class="navbar-brand mb-0 nav-text nav-brand-link">Journaley</a>
  <button type="button" class="btn nav-text">Logout</button>
</nav>

<div class="trip-highlights-body">
  <aside class="trip-highlights-sidebar">
    <app-section-list
      title="Trips"
      [items]="tripListItems"
      [selectedId]="selectedTripId"
      (addClick)="openCreateTripDialog()"
      (deleteClick)="openDeleteTripDialog($event)"
      (rowClick)="onTripRow($event)"
    ></app-section-list>
  </aside>

  <div class="trip-highlights-main-column">
    <div class="mt-5">
      <!-- <p class="title text-center mb-0">Trip Highlights</p> -->
      @if (countryLabel) {
        <p class="title text-center mb-0">Trip Highlights in {{ countryLabel }}</p>
      }
      <p class="sub-title text-center" [class.mt-1]="!!countryLabel">
        Capture what made this trip special.
      </p>
    </div>

    <div class="trip-highlights-main container-fluid px-3 px-md-4 py-4 pb-5">
      <app-trip-highlights-main
        [heading]="mainHeading"
        [bodyText]="mainBodyText"
        [photos]="mainPhotos"
        [traveledWith]="mainTraveledWith"
        (editTrip)="onEditTrip()"
      ></app-trip-highlights-main>
    </div>
  </div>
</div>
