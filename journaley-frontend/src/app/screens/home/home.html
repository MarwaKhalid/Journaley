<nav class="navbar nav px-3">
  <a routerLink="/" class="navbar-brand mb-0 nav-text nav-brand-link">Journaley</a>
  <button type="button" class="btn nav-text" (click)="logout()">Logout</button>
</nav>

<div class="mt-5">
  <p class="title text-center mb-0">Journaley</p>
  <p class="sub-title text-center">Your personal travel memory book</p>
</div>

<div class="carousel p-3">
  @if (countriesError()) {
    <div class="alert alert-warning py-2 small mb-3" role="alert">{{ countriesError() }}</div>
  }
  <div class="d-flex justify-content-between align-items-center gap-2 mb-3 home-btns">
    <app-search-field
      id="country-search"
      placeholder="Search by name"
      [(value)]="searchQuery"
    ></app-search-field>
    <app-icon-text-button
      class="text-nowrap"
      placeholder="Add Country"
      (click)="openCreateCountryDialog()"
    >
    </app-icon-text-button>
  </div>
  <p-carousel
    [value]="visibleCountries()"
    [numVisible]="3"
    [numScroll]="1"
    [circular]="true"
    [responsiveOptions]="responsiveOptions"
  >
    <ng-template let-country pTemplate="item">
      <div
        class="home-country-tile"
        role="link"
        tabindex="0"
        (click)="openCountryTrips(country)"
        (keydown.enter)="openCountryTrips(country)"
        (keydown.space)="$event.preventDefault(); openCountryTrips(country)"
      >
        <app-img-card
          [title]="country.name"
          [filename]="country.filename"
          [showBtn]="true"
          (editClick)="openEditCountryDialog(country)"
          (deleteClick)="openDeleteCountryDialog(country)"
        >
        </app-img-card>
      </div>
    </ng-template>
  </p-carousel>
</div>
