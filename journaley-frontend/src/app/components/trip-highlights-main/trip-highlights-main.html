<section class="thm-panel">
  <div class="thm-header-wrap">
    <h2 class="thm-title">{{ heading }}</h2>
    <div class="thm-edit-wrap">
      @if (canEdit) {
        <app-icon-text-button
          btn_type="edit"
          placeholder="Edit Trip"
          variant="muted"
          (btnClick)="onEdit()"
        ></app-icon-text-button>
      }
    </div>
  </div>
  <p class="thm-body">{{ bodyText }}</p>
  @if (photos.length) {
    <div class="thm-photos" role="list">
      @for (photo of photos; track photo.imageSrc) {
        <article class="thm-polaroid" role="listitem">
          <div class="thm-polaroid-img-wrap">
            <img
              [src]="photo.imageSrc"
              [alt]="photo.alt ?? 'Trip photo'"
              loading="lazy"
            />
          </div>
        </article>
      }
    </div>
  }
  @if (traveledWith.trim()) {
    <p class="thm-traveled-with">
      <span class="thm-traveled-with-label">Traveled with:</span>
      {{ traveledWith }}
    </p>
  }
</section>
