spring.application.name=journaley-api
spring.datasource.url=jdbc:mysql://localhost:3306/Journaley
spring.datasource.username=user
spring.datasource.password=pass
spring.jpa.hibernate.ddl-auto=update

# JWT settings (dev defaults; override in real deployments)
app.jwt.secret=change-me-to-a-long-32+chars-secret-please
app.jwt.expirationSeconds=3600

# CORS (comma-separated). Match your frontend dev server origin.
app.cors.allowedOrigins=http://localhost:5173,http://localhost:4200
