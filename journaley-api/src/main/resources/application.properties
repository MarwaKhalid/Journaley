spring.application.name=journaley-api
spring.datasource.url=jdbc:mysql://localhost:3306/Journaley
spring.datasource.username=user
spring.datasource.password=pass
spring.jpa.hibernate.ddl-auto=update

# JWT settings (dev defaults; override in real deployments)
app.jwt.secret=change-me-to-a-long-32+chars-secret-please
app.jwt.expirationSeconds=3600

# CORS (comma-separated). Match your frontend dev server origin.
app.cors.allowedOrigins=http://localhost:5173,http://localhost:4200,http://127.0.0.1:5173,http://127.0.0.1:4200

# Public origin for URLs returned in JSON (country imageUrl). No trailing slash.
app.public-base-url=http://localhost:8080

# Country cover images on disk (relative paths resolve against JVM working directory).
app.upload.country-images-dir=uploads/country-images

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Trip images on disk (relative paths resolve against JVM working directory).
app.upload.trip-images-dir=uploads/trip-images
