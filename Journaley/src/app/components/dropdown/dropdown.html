<div class="form-group">
  <label [for]="id" class="label">{{ label }}</label>
  <select
    class="form-select"
    [id]="id"
    [(ngModel)]="value"
    (ngModelChange)="valueChange.emit($event)"
  >
    <option value="" disabled>{{ placeholder }}</option>
    <option *ngFor="let option of options" [value]="option.value">
      {{ option.label }}
    </option>
  </select>
</div>
