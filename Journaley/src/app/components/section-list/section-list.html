<div class="section-list">
  <header class="section-list-header">
    <h2 class="section-list-title">{{ title }}</h2>
    <app-icon-button
      icon="plus-lg"
      ariaLabel="Add"
      [large]="true"
      (btnClick)="onAdd()"
    ></app-icon-button>
  </header>

  <ul class="section-list-items">
    @for (item of items; track item.id) {
      <li
        class="section-list-row"
        [class.section-list-row--selected]="selectedId === item.id"
        [attr.aria-current]="selectedId === item.id ? 'true' : undefined"
        (click)="onRowClick(item)"
      >
        <span class="section-list-label">{{ item.label }}</span>
        @if (item.deletable !== false) {
          <span class="section-list-actions" (click)="$event.stopPropagation()">
            <app-icon-button
              icon="trash3"
              [ariaLabel]="'Remove ' + item.label"
              (btnClick)="onDelete(item)"
            ></app-icon-button>
          </span>
        }
      </li>
    }
  </ul>
</div>
