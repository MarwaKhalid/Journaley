<div class="card border-0 info-card">
  <div class="card-body">
    <div class="d-flex align-items-center gap-2">
      <p class="card-title info-title mb-0">{{ title }}</p>
      <div class="ms-auto d-flex align-items-center gap-1">
        <app-icon-button
          icon="pen"
          ariaLabel="Edit entry"
          (btnClick)="editClick.emit()"
        ></app-icon-button>
        <app-icon-button
          icon="trash3"
          ariaLabel="Delete entry"
          (btnClick)="deleteClick.emit()"
        ></app-icon-button>
      </div>
    </div>

    <div class="d-flex align-items-center gap-1 info-stars" aria-hidden="true">
      @for (n of starSlots; track n) {
        <i
          class="bi"
          [class.bi-star-fill]="n <= rating"
          [class.bi-star]="n > rating"
        ></i>
      }
    </div>

    <div class="d-flex align-items-center gap-1 mt-3">
      <i class="bi bi-geo-alt-fill" aria-hidden="true"></i>
      <p class="card-text sub-text mb-0">
        {{ address }}
      </p>
    </div>
    <p class="card-text sub-text mt-2 mb-0">
      {{ review }}
    </p>
  </div>
</div>
