<div class="card w-50">
  <div class="card-body">
    <div class="d-flex align-items-center">
      <p class="card-title info-title mb-0">{{ title }}</p>
      <div class="ms-auto">
        <button class="btn rounded-circle icon-btn" (click)="onEditClick()">
          <i class="bi bi-pen"></i>
        </button>
        <button class="btn rounded-circle icon-btn ms-1" (click)="onDeleteClick()">
          <i class="bi bi-trash3"></i>
        </button>
      </div>
    </div>

    <div class="d-flex align-items-center">
      <i class="bi bi-star-fill"></i>
      <i class="bi bi-star-fill"></i>
      <i class="bi bi-star-fill"></i>
      <i class="bi bi-star-fill"></i>
      <i class="bi bi-star-fill"></i>
    </div>

    <div class="d-flex align-items-center gap-1 mt-3">
      <i class="bi bi-geo-alt-fill"></i>
      <p class="card-text sub-text mb-0">
        {{ address }}
      </p>
    </div>
    <p class="card-text sub-text mt-2">
      {{ review }}
    </p>
  </div>
</div>
