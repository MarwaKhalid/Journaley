<h2 class="modal-title text-center" mat-dialog-title>Create City</h2>
<mat-dialog-content class="mat-typography">
  <app-input-field
    label="City Name"
    id="city-name"
    placeholder="City Name"
    [(value)]="cityName"
  ></app-input-field>
</mat-dialog-content>
<div class="mt-3"></div>
<mat-dialog-actions>
  <app-text-button
    matButton
    mat-dialog-close
    btn_type="cancel"
    placeholder="Cancel"
  ></app-text-button>
  <app-text-button
    btn_type="submit"
    cdkFocusInitial
    placeholder="Add City"
    (btnClick)="onSubmit()"
  ></app-text-button>
</mat-dialog-actions>
