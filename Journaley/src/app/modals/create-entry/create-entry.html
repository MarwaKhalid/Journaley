<h2 class="modal-title text-center" mat-dialog-title>Add Entry</h2>
<mat-dialog-content class="mat-typography">
  <app-input-field
    label="Name"
    id="entry-name"
    placeholder="Entry Name"
    [(value)]="entryName"
  ></app-input-field>
</mat-dialog-content>
<div class="mt-3"></div>
<mat-dialog-actions>
  <app-text-button
    matButton
    mat-dialog-close
    btn_type="cancel"
    placeholder="Cancel"
  ></app-text-button>
  <app-text-button
    btn_type="submit"
    cdkFocusInitial
    placeholder="Add Entry"
    (btnClick)="onSubmit()"
  ></app-text-button>
</mat-dialog-actions>
